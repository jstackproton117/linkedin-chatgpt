# The Model Cantina — source and category configuration

categories:
  chat_reasoning:
    name: "General Chat & Reasoning"
  coding:
    name: "Coding"
  embeddings:
    name: "Embeddings / Vectorizing"
  ocr_document:
    name: "OCR & Document Conversion"
  local_open_weight:
    name: "Local / Open-Weight Registry"
  software_architecture:
    name: "Software Engineering & Architecture"
  classification_routing:
    name: "Classification, Routing & Triage"
  chunking_index:
    name: "Chunking & Index Enrichment"
  research:
    name: "Research / Web Search & Synthesis"
  privacy_trust:
    name: "Privacy & Trust-Boundary Enforcement"

# tier: A = structured API/JSON, no scraping. B = scraped/semi-structured, more fragile.
# categories: which category keys this source feeds (a source can feed more than one).
# proxy_for: categories where this source is an imperfect stand-in, not a direct measurement
#   (shown on the category view so proxy scores are never presented as if they were exact).
sources:
  swebench:
    tier: A
    name: "SWE-bench"
    url: "https://raw.githubusercontent.com/SWE-bench/swe-bench.github.io/main/data/leaderboards.json"
    categories: [coding]
    proxy_for: [software_architecture]
    poll_cadence_hours: 24

  mteb:
    tier: A
    name: "MTEB (Massive Text Embedding Benchmark)"
    url: "https://api.github.com/repos/embeddings-benchmark/results"
    categories: [embeddings]
    proxy_for: [chunking_index]
    poll_cadence_hours: 24

  hf_hub:
    tier: A
    name: "Hugging Face Hub API (new model discovery)"
    url: "https://huggingface.co/api/models"
    categories: [local_open_weight, coding, embeddings, ocr_document, chat_reasoning]
    proxy_for: []
    poll_cadence_hours: 24

  artificial_analysis:
    tier: B
    name: "Artificial Analysis"
    url: "https://artificialanalysis.ai"
    categories: [chat_reasoning, coding]
    proxy_for: [software_architecture]
    poll_cadence_hours: 24

  arena:
    tier: B
    name: "Arena (formerly LMArena/Chatbot Arena)"
    url: "https://api.wulong.dev/arena-ai-leaderboards/v1/leaderboard"
    note: "Unofficial community mirror, not the official Arena API."
    categories: [chat_reasoning]
    proxy_for: []
    poll_cadence_hours: 24

  livecodebench:
    tier: B
    name: "LiveCodeBench"
    url: "https://livecodebench.github.io/leaderboard.html"
    categories: [coding]
    proxy_for: []
    poll_cadence_hours: 24

  aider:
    tier: B
    name: "Aider Polyglot Leaderboard"
    url: "https://aider.chat/docs/leaderboards/"
    categories: [coding]
    proxy_for: [software_architecture]
    poll_cadence_hours: 168

  ollama_library:
    tier: B
    name: "Ollama Library"
    url: "https://ollama.com/library"
    categories: [local_open_weight]
    proxy_for: []
    poll_cadence_hours: 24

  ocr_benchmarks:
    tier: B
    name: "olmOCR-Bench / IDP Leaderboard"
    url: "https://idp-leaderboard.org"
    categories: [ocr_document]
    proxy_for: []
    poll_cadence_hours: 168

  safety_benchmarks:
    tier: B
    name: "JailbreakBench / HarmBench / AgentDojo"
    url: "https://jailbreakbench.github.io"
    categories: [privacy_trust]
    proxy_for: []
    poll_cadence_hours: 168

  vals_classification:
    tier: B
    name: "Vals.ai (classification-adjacent tasks)"
    url: "https://vals.ai/benchmarks"
    categories: [classification_routing]
    proxy_for: []
    poll_cadence_hours: 168

  browsecomp_plus:
    tier: A
    name: "BrowseComp-Plus"
    url: "https://tevatron-browsecomp-plus.hf.space/data/leaderboard.json"
    note: "Fixed 100K-doc corpus, not live web search — isolates model quality from retriever quality by design."
    categories: [research]
    proxy_for: []
    poll_cadence_hours: 168

# Human-readable label + one-line description per score_type, used to split
# a category's leaderboard into one table per metric instead of blending
# incomparable scales (Elo vs. percentage) into a single ranked list — see
# GOALS.md D11. Falls back to a prettified version of the raw score_type
# string for anything not listed here, so a new source never breaks.
score_types:
  arena_elo:
    label: "Arena — Elo"
    description: "Blind pairwise human-preference Elo rating. Unbounded scale, not a percentage."
  aa_intelligence_index:
    label: "Artificial Analysis — Intelligence Index"
    description: "Composite of 9 evals (GPQA Diamond, Humanity's Last Exam, SciCode, and others). 0-100ish scale."
  aa_terminalbench_v2_1_score:
    label: "Artificial Analysis — Terminal-Bench v2.1"
    description: "Agentic terminal-use/coding benchmark. Resolve-rate percentage."
  swebench_verified_resolve_rate:
    label: "SWE-bench Verified"
    description: "% of real GitHub issues resolved, 500 human-curated instances."
  livecodebench_pass_at_1:
    label: "LiveCodeBench — pass@1"
    description: "% of contest coding problems solved on first attempt, contamination-resistant (continuously new problems)."
  aider_polyglot_pass_rate_2:
    label: "Aider Polyglot — pass rate"
    description: "% of 225 Exercism exercises across 6 languages solved within 2 attempts."
  mteb_eng_v2_mean_task:
    label: "MTEB (eng, v2) — mean task score"
    description: "Mean score across retrieval/classification/clustering/STS tasks, English embedding benchmark."
  idp_leaderboard_olmocr_overall:
    label: "IDP Leaderboard — olmOCR"
    description: "OCR text-extraction fidelity sub-score."
  idp_leaderboard_omnidocbench_overall:
    label: "IDP Leaderboard — OmniDocBench"
    description: "Document layout/structure parsing sub-score."
  idp_leaderboard_idp_overall:
    label: "IDP Leaderboard — IDP Core"
    description: "Key-info extraction, table extraction, and document VQA sub-score."
  agentdojo_targeted_defense_rate:
    label: "AgentDojo — targeted defense rate"
    description: "% of prompt-injection attacks successfully resisted (inverted from AgentDojo's raw attack-success-rate so higher is always better here)."
  vals_legalbench_overall_accuracy_proxy:
    label: "Vals.ai LegalBench — accuracy (proxy)"
    description: "Legal text-classification accuracy, used as an imperfect proxy for general classification ability — not routing/triage specifically."
  browsecomp_plus_accuracy:
    label: "BrowseComp-Plus — accuracy"
    description: "% of hard research questions answered correctly, given a fixed 100K-doc corpus and a search tool (not live web). Same model can appear multiple times with different retrievers."

# 5-tier rating scale reused from the "AI Benchtests" Lumo benchmark project,
# for manual_notes.rating — kept consistent across Joe's tools.
manual_note_ratings:
  - "Recommended"
  - "Recommended with safeguards"
  - "Useful as a secondary tool"
  - "Experimental only"
  - "Not recommended"
