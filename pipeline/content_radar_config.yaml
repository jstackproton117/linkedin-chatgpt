  # ── Wider paper net ───────────────────────────────────────────────────────
  # HF Daily Papers shows what is already popular. These catch things earlier
  # and from different crowds. Each query is deliberately narrow and capped —
  # arXiv category firehoses would bury everything else.

  # Papers that working engineers upvoted on HN — a different, usually earlier
  # population than the one voting on Hugging Face.
  - name: "HN - papers"
    url: "hn://arxiv"
    source: "hn"
    category: "ai"
    type: "paper"
    query: "arxiv.org"
    min_points: 15
    hits: 25
    resolve_papers: true
    freshness_hours: 168
    max_items: 8







  # ── arXiv ─────────────────────────────────────────────────────────────────
  # ONE request per run, deliberately. Two things were broken before:
  #   * http://export.arxiv.org 301-redirects now and feedparser returns
  #     nothing, so every arXiv query had silently stopped working.
  #   * eight separate queries got 429-rate-limited after about two, so most
  #     came back empty even when the URL was correct.
  # One broad OR query, ranked locally afterwards, fixes both.
  #
  # Add a phrase here when a paper you liked would have been missed. The
  # consumer-GPU training terms exist because arXiv:2608.27370 ("Puro-2B ...
  # Trained on RTX 5090") slipped through — the earlier queries covered
  # inference but never training on consumer hardware.
  - name: "arXiv - Joe's topics"
    url: "https://export.arxiv.org/api/query?search_query=abs:%22LLM+inference%22+OR+abs:%22inference+serving%22+OR+abs:%22model+quantization%22+OR+abs:%22consumer+GPU%22+OR+abs:%22single+GPU%22+OR+abs:%22low-cost+training%22+OR+abs:%22efficient+pretraining%22+OR+abs:%22model+routing%22+OR+abs:%22LLM+cascade%22+OR+abs:%22inference+cost%22+OR+abs:%22LLM+agent%22+OR+abs:%22multi-agent+system%22+OR+abs:%22agent+harness%22+OR+abs:%22agentic+workflow%22+OR+abs:%22retrieval-augmented+generation%22+OR+abs:%22benchmark+contamination%22+OR+abs:%22evaluation+harness%22+OR+abs:%22text-to-SQL%22+OR+abs:%22code+generation%22+OR+abs:%22developer+productivity%22+OR+abs:%22software+engineering+management%22+OR+abs:%22engineering+teams%22&sortBy=submittedDate&sortOrder=descending&max_results=100"
    category: "ai"
    type: "paper"
    freshness_hours: 120
    max_items: 12

  # ── Community signal ──────────────────────────────────────────────────────
  # Reddit rate-limits aggressively; a failed fetch is logged and skipped, and
  # r/LocalLLaMA in particular tracks Joe's local-inference work closely.
  - name: "r/LocalLLaMA"
    user_agent: "rebel-intel/1.0 (personal news aggregator)"
    url: "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day"
