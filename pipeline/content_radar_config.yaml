  # ── Podcasts ─────────────────────────────────────────────────────────────
  # The main latent.space feed is dominated by the daily AINews digests, so
  # actual episodes get buried. This is the dedicated podcast feed.
  # Episodes ship roughly every 4 days (max observed gap 13), so the default
  # 72h window would miss most of them — hence the 14-day override.
  - name: "Latent Space Podcast"
    url: "https://api.substack.com/feed/podcast/1084089.rss"
    category: "ai"
    type: "podcast"
    freshness_hours: 336

  # ── Papers ───────────────────────────────────────────────────────────────
  # Hugging Face Daily Papers: community-curated with upvotes, which is the
  # closest thing to "what the ML community actually surfaced today".
  # Raw arXiv is ~800 papers/day and would drown every other source.
  - name: "HF Daily Papers"
    url: "https://huggingface.co/papers"
    source: "hf_papers"
    category: "ai"
    type: "paper"
    freshness_hours: 72
    min_upvotes: 5
    max_items: 12



  # ── Discord ───────────────────────────────────────────────────────────────
  # Harvests paper links people share in Discord channels, using reaction
  # counts as the quality signal. Disabled until a bot token exists.
  #
  # A bot can only be added to a server by someone holding Manage Server
  # THERE. So this works for servers Joe controls, and for another server's
  # announcement channels mirrored into his via Discord Channel Following.
  # It CANNOT read the Latent Space Discord unless their admins add the bot.
  #
  # Setup: cp discord_config.example.json discord_config.json, follow the
  # _setup steps inside it, then run: .venv/bin/python check_discord.py
  # When that passes, flip `enabled` to true.
  - name: "Discord - shared papers"
    url: "discord://configured-channels"
    source: "discord"
    enabled: false
    category: "ai"
    type: "paper"
    freshness_hours: 168
    papers_only: true
    min_reactions: 0
    per_channel_limit: 100

  # ── AI podcasts ───────────────────────────────────────────────────────────
  # All verified live with their real publish cadence. Podcasts get a 14-day
  # window because most are weekly — a 72h window would miss them entirely.
  # ThursdAI's dedicated podcast RSS is stale (78 days); its Substack feed is
  # the live one, so use that.
  - name: "ThursdAI"
    url: "https://sub.thursdai.news/feed"
    category: "ai"
    type: "podcast"
    freshness_hours: 336

  - name: "Dwarkesh Podcast"
