# Rebel Intel — experience corpus and ranking config.
#
# The `experience` block is the ground truth for "do I actually have something
# useful to say about this?" Every article is embedded and compared against
# every phrase here. Articles that touch work Joe has actually done rank higher.
#
# EDIT THIS FILE FREELY. Adding a phrase or an item takes effect on the next
# run — no code change needed.
#
# WHY PHRASES AND NOT PARAGRAPHS: an embedding of a long paragraph is the
# average of everything in it, which matches everything weakly and nothing
# strongly. Short, concrete, single-idea phrases match sharply. An item scores
# as its best-matching phrase, so more phrases costs nothing but coverage.
#
#   id      — short slug, recorded on every article as the matched experience
#   label   — human-readable name, shown in the review UI
#   short   — one line, kept for reference and future prompts
#   phrases — the things that actually get embedded. Concrete nouns beat
#             abstractions: "VRAM limits on consumer GPUs" not "hardware".

experience:
  - id: raptor
    label: "Raptor coding harness"
    short: "built Raptor, an autonomous sprint-based AI coding harness on local GPUs"
    phrases:
      - "autonomous AI coding harness that plans and executes sprints"
      - "running Qwen3-Coder 30B locally on dual RTX 5090 GPUs"
      - "routing work between local open-weight models and frontier APIs"
      - "critic models reviewing generated code across multiple GPUs"
      - "conditional QA stages in an automated coding pipeline"
      - "measuring frontier API spend per coding sprint"

  - id: agent_orchestration
    label: "Multi-agent orchestration"
    short: "designs multi-agent architectures, tool discovery, self-improving harnesses"
    phrases:
      - "multi-agent architecture with planner and executor agents"
      - "orchestrating multiple AI agents on one task"
      - "agent tool discovery and tool selection at scale"
      - "GraphRAG for retrieving tools and context"
      - "agent memory and context window management"
      - "self-improving agent harness that rewrites its own tools"
      - "why multi-agent systems drift off task and fail"
      - "subagent fan-out and result synthesis"

  - id: local_inference
    label: "Local inference & open-weight models"
    short: "runs open-weight models on consumer GPUs, quantization, VRAM, throughput"
    phrases:
      - "running open-weight LLMs locally on consumer GPUs"
      - "Ollama, vLLM and llama.cpp for self-hosted inference"
      - "GGUF quantization and its effect on model quality"
      - "VRAM limits and context length tradeoffs"
      - "tokens per second and inference latency under load"
      - "small open models versus hosted frontier APIs"
      - "when a 7B model is good enough for a task"
      - "self-hosting inference instead of paying per token"

  - id: model_routing_cost
    label: "Model routing & frontier spend"
    short: "measures and cuts frontier API spend by routing work to cheaper models"
    phrases:
      - "cutting AI API costs by routing to cheaper models"
      - "cost per task and cost per resolved issue as a metric"
      - "token budgets and prompt caching to control spend"
      - "the rising price of agentic coding tools"
      - "AI inference economics and unit costs at scale"
      - "when frontier model quality is worth the price premium"

  - id: agentic_coding_practice
    label: "Agentic coding in real use"
    short: "uses agentic coding tools daily and knows where they break"
    phrases:
      - "using AI coding agents on a real production codebase"
      - "Claude Code and other agentic coding tools in daily work"
      - "AI agents opening pull requests and reviewing code"
      - "where coding agents break on large or messy codebases"
      - "vibe coding a demo versus shipping production software"
      - "test driven development inside an agent loop"
      - "measuring whether an AI coding tool actually saves time"
      - "AI-generated code introducing security problems"

  - id: model_evals
    label: "Benchmarks & model evaluation"
    short: "built a leaderboard aggregator, knows benchmark reliability problems"
    phrases:
      - "comparing AI models on benchmark leaderboards"
      - "SWE-bench, LiveCodeBench and coding benchmark results"
      - "benchmark contamination and saturation"
      - "why leaderboards disagree about which model is best"
      - "normalizing scores across incompatible benchmark sources"
      - "picking a model for a real workload rather than a headline score"
      - "new model release and how it scores against rivals"

  - id: enterprise_it
    label: "Enterprise IT & identity"
    short: "runs Intune/Entra/Apple Business Manager migrations and federated auth"
    phrases:
      - "Microsoft Intune and Entra ID device management"
      - "Apple Business Manager and Apple device deployment"
      - "federated authentication with OIDC and SAML single sign-on"
      - "MDM policy and endpoint compliance across a device fleet"
      - "enterprise identity as the security control plane"
