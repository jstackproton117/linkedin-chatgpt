  - id: delivery_management
    label: "Technical delivery & consulting"
    short: "manages delivery teams shipping AI to real users under real constraints"
    phrases:
      - "managing a team delivering an AI project to a deadline"
      - "why enterprise AI pilots stall before reaching production"
