# ── Noise filters ────────────────────────────────────────────────────────
# Articles whose title matches any of these regexes are pushed to the bottom
# of the list, never deleted. Every match is recorded in data/rank_log.jsonl
# so you can audit what was suppressed and loosen a pattern if it overreaches.
noise_filters:
  title_patterns:
    # Shopping context is required. Bare "deal" or "discount" patterns were
    # too broad — they suppressed "Fujitsu education deal", "a Bad Deal for
    # Teens", and an AINews digest that merely used the word "discounted".
    - '\bpromo code'
    - '\bcoupon'
    - '\bdiscount codes?\b'
    - '\d+\s*%\s*off\b'
    - '\bdeals?:\s'
    - '\bbest\b[^|]*\bdeals?\b'
    - '\b(holiday|prime day|black friday|cyber monday|labor day|memorial day)\s+deals?\b'
    - '\bsave up to\b'
    - '\bprime day\b'
    - '\bgift guide\b'
    - '\bon sale\b'
    - '\blowest price\b'
    - '\bgiveaway\b'
    - '\bunboxing\b'
    - '\bbest \w+ (laptops?|phones?|tablets?|tvs?|headphones|monitors?)\b'
    - '\bwordle\b'
    - '\bconnections\b.*\bhints?\b'
    - '\bhoroscope\b'
    - '\b(shares|stock) (jump|jumps|fall|falls|slide|slides|surge|surges|plunge|plunges)\b'
    - '\bcrypto (price|prices)\b'


# ── Tunables ─────────────────────────────────────────────────────────────
tunables:
  # How many articles get the local-model classification pass, in prior order.
  # At roughly 1.5s each this comfortably covers a full 200-article fetch, and
  # classifying everything avoids judged and unjudged articles competing on
  # different scales. Lower it only if a run starts taking too long.
  llm_judge_top_n: 250

  # Scoring weights. `taste` is the user-feedback factor and is HARD BOUNDED
  # to [0.33, 0.50] in code — not less than a third (Joe's judgment matters),
  # not more than half (one person's taste shouldn't dominate the signal).
  weights:
    taste: 0.40
    experience: 0.30
    takeability: 0.15
    freshness: 0.10
    corroboration: 0.05

  # Taste model. Needs this many of each label before it is trusted at all;
  # below the threshold its weight is redistributed to the other factors.
  min_draft_samples: 12
  min_skip_samples: 12
  hold_weight: 0.5          # a "hold" counts as a half-strength positive

  # Near-duplicate detection. A pair must clear BOTH thresholds to merge.
  dup_cosine: 0.90
  dup_jaccard: 0.25
  max_corroboration: 5      # cap on how much repeated coverage can boost a story

  # Performance-metrics feedback. Deliberately inert until there is enough
  # data to learn from — see metrics_multiplier() in 07_rank.py.
  min_metrics_posts: 20

  # Minimum match strength before an experience topic is named in the UI.
  # Vectors are mean-centered first, so this is a small number by design:
  # across a typical 200-article batch the median best-match cosine is ~0.15.
  # Below this the article is shown as unattributed rather than labelled with
  # a topic the numbers do not actually support.
  min_attribution_cosine: 0.12

  # When the runner-up topic is within this margin of the winner and also
  # clears the cosine bar, BOTH are named. Two of your areas matching at once
  # means a richer article, not an ambiguous one.
  min_attribution_gap: 0.02

  # Log retention
  rank_log_days: 30
  embedding_cache_days: 14
